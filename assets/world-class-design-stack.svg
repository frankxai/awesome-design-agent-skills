<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">World-class brand and design-agent production stack</title>
  <desc id="desc">A nine-stage operating stack from evidence and brand strategy through identity, design system, asset production, product integration, visual quality assurance, and production proof.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071015"/><stop offset="1" stop-color="#0b1118"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#35d0ba"/><stop offset="0.5" stop-color="#66a8ff"/><stop offset="1" stop-color="#bc8cff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#20303b" stroke-width="1" opacity="0.32"/></pattern>
    <style>
      .t{font-family:Arial,Helvetica,sans-serif;fill:#eff8f7}.m{font-family:Arial,Helvetica,sans-serif;fill:#9fb2bd}.mono{font-family:'Courier New',monospace}.h1{font-size:46px;font-weight:700;letter-spacing:-1.2px}.sub{font-size:19px}.cap{font-size:13px;font-weight:700;letter-spacing:2px}.stage{font-size:20px;font-weight:700}.body{font-size:14px}.small{font-size:12px}.box{fill:#0f1b22;stroke:#29414d;stroke-width:1.5}.leader{fill:#101a25;stroke:#42627a;stroke-width:1.2}.owned{fill:#10261f;stroke:#35d0ba;stroke-width:2}.gate{fill:#20182c;stroke:#bc8cff;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1600" height="980" fill="url(#bg)"/>
  <rect width="1600" height="980" fill="url(#grid)"/>
  <rect x="70" y="54" width="1460" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="70" y="128" class="t cap">FRANKX DESIGN INTELLIGENCE · 2026</text>
  <text x="70" y="188" class="t h1">From references to a production-grade brand</text>
  <text x="70" y="225" class="m sub">No single skill is the system. Authority, taste, generation, inspection, and release proof are separate layers.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="275" width="300" height="155" rx="18" class="owned"/>
    <text x="94" y="309" class="t cap">OWNED AUTHORITY</text>
    <text x="94" y="347" class="t stage">Starlight Design</text><text x="94" y="373" class="t stage">Intelligence</text>
    <text x="94" y="403" class="m body">Brand packs · logo/type gates</text><text x="94" y="423" class="m body">tokens · evidence · rollback</text>

    <rect x="395" y="275" width="1135" height="155" rx="18" class="leader"/>
    <text x="420" y="309" class="t cap">SPECIALIST INTELLIGENCE · SELECT BY JOB</text>
    <text x="420" y="350" class="t stage">UI UX Pro Max</text><text x="420" y="376" class="m body">Searchable patterns</text>
    <text x="640" y="350" class="t stage">Impeccable</text><text x="640" y="376" class="m body">Craft + detector</text>
    <text x="850" y="350" class="t stage">Frontend Design</text><text x="850" y="376" class="m body">Concise baseline</text>
    <text x="1090" y="350" class="t stage">Taste Skill</text><text x="1090" y="376" class="m body">High variance</text>
    <text x="1290" y="350" class="t stage">Emil</text><text x="1290" y="376" class="m body">Interaction craft</text>
    <path d="M600 397H600" stroke="#42627a"/>
    <text x="420" y="411" class="m small">References accelerate judgment; they never override product truth or rights.</text>
  </g>

  <text x="70" y="493" class="t cap">THE NINE-STAGE RELEASE LOOP</text>
  <g filter="url(#shadow)">
    <rect x="70" y="520" width="270" height="135" rx="16" class="box"/><text x="92" y="551" class="m cap">01 · EVIDENCE</text><text x="92" y="584" class="t stage">Research the real world</text><text x="92" y="612" class="m body">Audience · market · assets</text><text x="92" y="633" class="m body">rights · anti-references</text>
    <rect x="365" y="520" width="270" height="135" rx="16" class="box"/><text x="387" y="551" class="m cap">02 · THESIS</text><text x="387" y="584" class="t stage">Choose the difference</text><text x="387" y="612" class="m body">One recipient · one job</text><text x="387" y="633" class="m body">exactly three directions</text>
    <rect x="660" y="520" width="270" height="135" rx="16" class="box"/><text x="682" y="551" class="m cap">03 · IDENTITY</text><text x="682" y="584" class="t stage">Build original masters</text><text x="682" y="612" class="m body">Vector logo · type license</text><text x="682" y="633" class="m body">voice · color · imagery</text>
    <rect x="955" y="520" width="270" height="135" rx="16" class="box"/><text x="977" y="551" class="m cap">04 · SYSTEM</text><text x="977" y="584" class="t stage">Encode decisions</text><text x="977" y="612" class="m body">Tokens · DESIGN.md</text><text x="977" y="633" class="m body">components · motion rules</text>
    <rect x="1250" y="520" width="280" height="135" rx="16" class="box"/><text x="1272" y="551" class="m cap">05 · ASSETS</text><text x="1272" y="584" class="t stage">Create the usable suite</text><text x="1272" y="612" class="m body">Web · social · decks · app</text><text x="1272" y="633" class="m body">hashes · provenance · scores</text>
  </g>
  <path d="M340 588H355M635 588H650M930 588H945M1225 588H1240" stroke="#35d0ba" stroke-width="3"/>

  <g filter="url(#shadow)">
    <rect x="70" y="690" width="340" height="135" rx="16" class="box"/><text x="92" y="721" class="m cap">06 · PRODUCT</text><text x="92" y="754" class="t stage">Integrate in the owner repo</text><text x="92" y="782" class="m body">Real routes · responsive behavior</text><text x="92" y="803" class="m body">proof beside claims</text>
    <rect x="435" y="690" width="340" height="135" rx="16" class="gate"/><text x="457" y="721" class="m cap">07 · VISUAL QA</text><text x="457" y="754" class="t stage">Inspect rendered truth</text><text x="457" y="782" class="m body">Mobile · a11y · type · detector</text><text x="457" y="803" class="m body">Playwright · axe · Lighthouse</text>
    <rect x="800" y="690" width="340" height="135" rx="16" class="gate"/><text x="822" y="721" class="m cap">08 · SEPARATION</text><text x="822" y="754" class="t stage">Maker ≠ verifier ≠ owner</text><text x="822" y="782" class="m body">Independent score · legal/IP gate</text><text x="822" y="803" class="m body">named-human approval</text>
    <rect x="1165" y="690" width="365" height="135" rx="16" class="owned"/><text x="1187" y="721" class="m cap">09 · PRODUCTION</text><text x="1187" y="754" class="t stage">Deploy, prove, roll back</text><text x="1187" y="782" class="m body">Commit · checks · live URL</text><text x="1187" y="803" class="m body">post-deploy receipt · rollback</text>
  </g>
  <path d="M410 758H425M775 758H790M1140 758H1155" stroke="#bc8cff" stroke-width="3"/>

  <rect x="70" y="865" width="1460" height="65" rx="14" fill="#0e181e" stroke="#29414d"/>
  <text x="94" y="893" class="t cap">DIFFERENCE ENGINE</text>
  <text x="94" y="918" class="m body">Specific evidence  +  anti-references  +  one signature memory  +  brand boundaries  +  disciplined subtraction  +  repeatable production</text>
</svg>
